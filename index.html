<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Tempi e Video</title>
<style>
:root{--bg:#0d0f12;--panel:#161a20;--line:#262c35;--fg:#eef1f4;--mut:#8b95a1;--rec:#ff3b30;--go:#28c76f;--lap:#ffb020;--stop:#e8ecf0;--acc:#4da3ff;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.4 system-ui,Roboto,sans-serif;-webkit-tap-highlight-color:transparent;
 padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
body.app{position:fixed;inset:0;padding:0;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body.app input{user-select:text;-webkit-user-select:text}
h1{font-size:18px;margin:0;font-weight:700}
h2{font-size:17px;margin:0}
.mut{color:var(--mut);font-size:13px}
select,input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;min-width:0}
input{width:100%}
body.tablet .ph{display:none!important}
body:not(.tablet) .tb{display:none!important}

/* ---------- schermata ripresa ---------- */
#cam{position:absolute;inset:0;background:#000}
#preview{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.camMsg{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:#aab3bd;pointer-events:none}
.ob{border:0;border-radius:12px;font:700 15px system-ui,Roboto,sans-serif;color:#0d0f12;background:var(--stop);touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.ob:active{filter:brightness(.8)}
.ob:disabled{opacity:.35}
.ob.glass{background:rgba(20,24,30,.72);color:#fff;border:1px solid rgba(255,255,255,.25)}
.ob.sm{height:40px;padding:0 14px;font-size:14px}
.ob.go{background:var(--go)}
.ob.lap{background:var(--lap)}
.ob.r50{background:var(--rec);color:#fff}
.ob.rec{background:var(--rec);color:#fff}
.ob.rec.on{background:#fff;color:var(--rec)}
select.glass{height:40px;max-width:42vw;background:rgba(20,24,30,.72);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:0 10px;font:600 14px system-ui,Roboto,sans-serif}

#top{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;
 padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
#top .g{display:flex;gap:8px;align-items:center;min-width:0}
#top .l{justify-self:start}
#top .m{flex-direction:column;gap:4px;justify-self:center}
#top .r{justify-self:end}
#clock{font:700 34px/1.1 ui-monospace,"Roboto Mono",Menlo,monospace;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.55);color:#fff;padding:2px 14px;border-radius:12px}
#hud{background:rgba(0,0,0,.55);color:#fff;padding:2px 10px;border-radius:10px;font-size:12px;font-variant-numeric:tabular-nums;max-width:46vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud:empty{display:none}
#recBadge{display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.6);color:#fff;padding:6px 10px;border-radius:99px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
#recBadge i{width:9px;height:9px;border-radius:50%;background:var(--rec);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#recBadge i{animation:none}}

#left{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 50px);bottom:max(10px,env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));width:64px;display:flex;flex-direction:column;align-items:center;gap:8px}
#zoomLbl{background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:2px 8px;font:600 13px ui-monospace,"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
#zoom{flex:1;min-height:0;width:44px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;writing-mode:vertical-lr;direction:rtl}
#zoom::-webkit-slider-runnable-track{width:6px;border-radius:3px;background:rgba(255,255,255,.55)}
#zoom::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #0d0f12;margin-left:-11px;box-shadow:0 1px 5px rgba(0,0,0,.6)}
#zoom:disabled{opacity:.35}
#btnRec{width:64px;height:50px;flex:none;font-size:14px}

#right{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;width:112px}
#right .ob{height:48px;width:100%;padding:0 4px;font-size:14px}
#mainb{display:flex;flex-direction:column;gap:6px}
#right .prow .ob{height:46px;font-size:18px}
#right #pUndo{height:34px;font-size:13px;flex:1 1 100%;order:3}
#penLbl{background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:2px 6px;font-size:11px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.prow{display:flex;gap:6px;flex-wrap:wrap}
.prow .ob{flex:1 1 40%;min-width:0}

#rot{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px;font-size:18px;font-weight:600}
@media (orientation:portrait){body.camera #rot{display:grid}}

/* ---------- modalità cronometro (senza fotocamera) ---------- */
body.timer #preview,body.timer #camMsg,body.timer #left,body.timer #recBadge,body.timer #bSend,body.timer .tab[data-tab=video]{display:none!important}
body:not(.camera) .cm{display:none!important}
body.timer #cam{display:flex;flex-direction:column;gap:8px;overflow:auto;background:var(--bg);padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
body.timer #top{position:static;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"l r" "m m";gap:6px;padding:0}
body.timer #top .l{grid-area:l}
body.timer #top .m{grid-area:m;align-items:center;gap:4px}
body.timer #top .r{grid-area:r;justify-self:stretch}
body.timer select.glass{max-width:none;width:100%;height:40px;background:var(--panel)}
body.timer #bTempi{background:var(--panel)}
body.timer #clock{font-size:clamp(30px,13vmin,84px);background:none;padding:0;text-align:center}
body.timer #hud{max-width:100%;background:rgba(255,255,255,.07)}
body.timer #right{position:static;width:auto;flex:1;min-height:0;gap:6px}
body.timer #mainb{flex:1;min-height:0;display:grid;gap:6px;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr}
body.timer #right #mainb .ob{height:auto;min-height:52px;width:auto;font-size:clamp(9px,3vw,24px);padding:0 2px;box-shadow:none}
body.timer #penLbl{align-self:center;margin:0}
body.timer .prow{flex-wrap:nowrap}
body.timer #right .prow .ob{flex:1;height:clamp(44px,10vh,66px);font-size:clamp(16px,4.5vmin,24px);box-shadow:none}
body.timer #right #pUndo{flex:1;order:0;height:clamp(44px,10vh,66px);font-size:clamp(10px,3vw,15px);background:var(--panel)}
@media (min-height:520px) and (max-aspect-ratio:1/1){
 body.timer #mainb{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}
 body.timer #right #mainb .ob{font-size:clamp(20px,8vw,36px)}
}
@media (max-height:340px){body.timer #hud,body.timer #penLbl{display:none}}
.vr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.pl{border:0;background:var(--go);color:#0d0f12;border-radius:6px;font-size:11px;padding:2px 7px;margin-left:6px;touch-action:manipulation}
#pvSync{position:absolute;left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;background:rgba(20,24,30,.88);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 12px;color:#fff;font-size:13px;max-width:90vw}
#pvSync .hint{flex:1 1 100%;text-align:center;color:#aab3bd;font-size:12px}

/* ---------- schermata Allenamento ---------- */
#tempi{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;
 padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
#thw{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:max(8px,env(safe-area-inset-top))}
.th{display:flex;align-items:center;gap:10px;padding:0 0 8px}
.th h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tab{flex:none;padding:10px 16px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font:600 14px system-ui,Roboto,sans-serif;touch-action:manipulation}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ban{background:#3a2d0a;border:1px solid #6b5217;color:#ffd78a;border-radius:10px;padding:6px 10px;margin-bottom:8px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px}
.tc{max-width:1100px;margin:0 auto}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{flex:1;min-height:52px;border:0;border-radius:14px;font:700 16px system-ui,Roboto,sans-serif;color:#0d0f12;background:var(--stop);touch-action:manipulation}
.btn:active{filter:brightness(.85)}
.btn:disabled{opacity:.3}
.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn.go{background:var(--go)}
.btn.sm{flex:none;min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.armed{background:var(--rec);color:#fff;border-color:var(--rec)}
a.btn{display:grid;place-items:center;text-decoration:none;margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.chip{flex:none;padding:11px 16px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font:600 15px system-ui,Roboto,sans-serif}
.chip.on{background:var(--acc);color:#0d0f12;border-color:var(--acc)}
.run{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.run .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.run .tot{font:700 22px ui-monospace,"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
.run .sub{margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;text-align:right;padding:4px}
th:first-child,td:first-child{text-align:left}
td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
tr.fin td{font-weight:700}
.p2{color:var(--lap);font-weight:700}
.p50{color:var(--rec);font-weight:700}
.pt{margin-top:8px;font-weight:600}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 8px}
.lk{display:block;margin:6px 0 2px;font-size:13px;color:var(--mut)}
.lk input{margin-top:4px}

.tw{overflow-x:auto;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table.st{font-size:14px}
table.st th,table.st td{padding:7px 9px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
table.st th{border-top:0;text-align:right}
table.st th.l,table.st td.an{text-align:left}
table.st td.an{vertical-align:top;min-width:110px}
table.st tbody.ath>tr:first-child>td{border-top:2px solid #39414d}
table.st td.best{color:var(--go);font-weight:700}
table.st td.fn{font-weight:700}
@media (min-width:900px){table.st{font-size:17px}table.st th{font-size:12px}}
.vg{margin-top:16px}
.vg h2{margin-bottom:6px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.vcard .vt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.vcard .vt .tot{font:700 18px ui-monospace,"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
#player{position:fixed;inset:0;z-index:45;background:#000;display:grid;place-items:center}
#player video{max-width:100%;max-height:100%;background:#000}
#pvClose{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));min-height:44px;padding:0 16px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(20,24,30,.8);color:#fff;font:700 15px system-ui,Roboto,sans-serif}
#modal{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:460px;width:100%}
.mbox p{margin:0 0 12px;font-size:16px}
.mbox .row{margin-top:0}
#toast{position:fixed;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 84px);transform:translateX(-50%);background:#fff;color:#0d0f12;padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;text-align:center;z-index:60}
#toast.on{opacity:1}
#viewer{max-width:560px;margin:0 auto}
</style>
</head>
<body>

<div id="viewer" hidden></div>

<div id="cam" hidden>
 <video id="preview" autoplay muted playsinline></video>
 <div id="camMsg" class="camMsg">Avvio fotocamera…</div>
 <div id="top">
  <div class="g l">
   <button id="bTempi" class="ob glass sm">Tempi</button>
   <div id="recBadge" hidden><i></i><span id="recTime">0:00</span></div>
   <button id="bSend" class="ob go sm" hidden>Invia al tablet</button>
  </div>
  <div class="g m"><div id="clock">0:00.00</div><div id="hud"></div></div>
  <div class="g r"><select id="athSel" class="glass" aria-label="Atleta"></select></div>
 </div>
 <div id="left">
  <div id="zoomLbl">×1.0</div>
  <input id="zoom" type="range" min="1" max="10" step="0.1" value="1" aria-label="Zoom">
  <button id="btnRec" class="ob rec">● REC</button>
 </div>
 <div id="right">
  <div id="mainb">
   <button id="bStart" class="ob go">START</button>
   <button id="bLap" class="ob lap" disabled>INTERTEMPO</button>
   <button id="bStop" class="ob" disabled>STOP</button>
  </div>
  <div id="penLbl">Penalità</div>
  <div class="prow">
   <button id="p2" class="ob lap">+2</button>
   <button id="p50" class="ob r50">+50</button>
   <button id="pUndo" class="ob glass">Annulla</button>
  </div>
 </div>
</div>

<div id="tempi" hidden>
 <div id="thw">
  <div class="th">
   <button id="bBack" class="btn ghost sm ph">← Ripresa</button>
   <h1 id="tTitle">Allenamento</h1>
   <button id="bImport" class="btn go sm tb">Importa</button>
  </div>
  <div class="tabs" id="tabs">
   <button class="tab on" data-tab="tempi">Tempi</button>
   <button class="tab" data-tab="video">Video</button>
   <button class="tab ph" data-tab="atleti">Atleti</button>
   <button class="tab" data-tab="sess">Allenamenti</button>
   <button class="tab" data-tab="imp">Impostazioni</button>
  </div>
  <div id="vbanner" class="ban" hidden></div>
 </div>
 <div class="tc">
  <section id="pTempi" data-pane>
   <div class="row" style="margin-top:0">
    <button id="bSendT" class="btn ghost ph">Invia tempi al tablet</button>
    <button id="bCsv" class="btn ghost">Esporta CSV</button>
   </div>
   <div id="sessTable"></div>
  </section>
  <section id="pVideo" data-pane hidden><div id="vidList"></div></section>
  <section id="pAtleti" data-pane hidden>
   <p class="lbl" style="margin-top:4px">Atleta</p>
   <div id="chips" class="chips"></div>
   <form id="addF" class="row">
    <input id="newA" placeholder="Nome atleta" autocomplete="off" enterkeyhint="done" style="flex:1">
    <button class="btn go" style="flex:none;padding:0 18px">Aggiungi</button>
   </form>
   <div id="results"></div>
  </section>
  <section id="pSess" data-pane hidden><div id="sessBox"></div></section>
  <section id="pImp" data-pane hidden>
   <p class="lbl" style="margin-top:4px">Questo dispositivo</p>
   <div class="row" style="margin-top:0">
    <select id="devMode" aria-label="Uso del dispositivo">
     <option value="timer">Telefono: cronometro (video con la fotocamera Samsung)</option>
     <option value="camera">Telefono: ripresa con la fotocamera dell'app</option>
     <option value="tablet">Tablet (archivio: tempi e video)</option>
    </select>
   </div>
   <div class="ph cm">
    <p class="lbl">Ripresa</p>
    <div class="row" style="margin-top:0">
     <select id="quality" aria-label="Qualità video">
      <option value="720">720p 30</option>
      <option value="1080">1080p 30</option>
      <option value="1080-60">1080p 60</option>
     </select>
     <button id="btnFlip" class="btn ghost sm">Cambia camera</button>
     <button id="btnFs" class="btn ghost sm">Schermo intero</button>
    </div>
    <div class="row">
     <select id="autoStop" aria-label="Stop automatico del video">
      <option value="0">Stop video: solo manuale</option>
      <option value="3">Stop video 3 s dopo lo STOP del tempo</option>
      <option value="5">Stop video 5 s dopo lo STOP del tempo</option>
      <option value="10">Stop video 10 s dopo lo STOP del tempo</option>
     </select>
    </div>
   </div>
  </section>
 </div>
</div>

<div id="player" hidden><video id="pv" controls playsinline></video><button id="pvClose">✕ Chiudi</button><div id="pvSync" hidden><button id="pvM" class="btn ghost sm">− 0,5 s</button><span id="pvOff">Correzione 0,0 s</span><button id="pvP" class="btn ghost sm">+ 0,5 s</button><div class="hint">Se la discesa non è ancora partita premi +, se è già in corso premi −</div></div></div>
<div id="modal" hidden><div class="mbox"><p id="mMsg"></p><div id="mBtns" class="row"></div></div></div>
<input id="impF" type="file" multiple accept="video/*,.txt,text/plain" hidden>
<div id="rot">Ruota il telefono in orizzontale</div>
<div id="toast" role="status"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>{ms=Math.max(0,Math.round(Number(ms)||0));const cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return m+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0')};
const pad=n=>String(n).padStart(2,'0');
const stamp=()=>{const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())};
const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'atleta';
const enc=o=>{const b=new TextEncoder().encode(JSON.stringify(o));let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const dec=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))))};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(30)}catch{}};
const isTablet=()=>document.body.classList.contains('tablet');
const whenLong=d=>{try{return new Date(d).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return ''}};
const dayLabel=d=>{try{return new Date(d).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})}catch{return ''}};
const normName=n=>String(n).replace(/ \(\d+\)(\.[A-Za-z0-9]+)$/,'$1');
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
function ask(msg,btns){
 return new Promise(res=>{
  $('#mMsg').textContent=msg;const box=$('#mBtns');box.innerHTML='';
  btns.forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.cls||'ghost');e.textContent=b.t;e.onclick=()=>{$('#modal').hidden=true;res(b.v)};box.appendChild(e)});
  $('#modal').hidden=false;
 });
}

/* ---------- dati ---------- */

/* ---------- penalità ---------- */
/* ogni penalità è {s:tratto, k:2|50}; s=-1 = aggiunta dopo l'arrivo (conta solo nel totale) */
function totals(r){
 const pe=Array.isArray(r.pe)?r.pe:[];let n2=0,n50=0;
 pe.forEach(e=>{if(Number(e.k)===50)n50++;else n2++});
 return{pe,n2,n50,tot:n2*2+n50*50};
}
const penTxt=(pe,s)=>pe.filter(e=>Number(e.s)===s).map(e=>'<span class="p'+(Number(e.k)===50?50:2)+'">+'+(Number(e.k)===50?50:2)+'</span>').join(' ');

/* ---------- tabella di una prova ---------- */
function runHTML(r,i,withEdit){
 const T=totals(r),l=Array.isArray(r.l)?r.l:[];
 const rows=[];let prev=0;
 l.forEach((x,k)=>{const c=Number(x.c)||0;rows.push({n:'Int. '+(k+1),p:c-prev,c,v:x.v,s:k});prev=c});
 const t=Number(r.t)||0;
 rows.push({n:'Arrivo',p:t-prev,c:t,v:r.tv,s:l.length,fin:1});
 const hasV=rows.some(x=>x.v!=null);
 const body=rows.map(x=>`<tr${x.fin?' class="fin"':''}><td>${x.n}</td><td>${fmt(x.p)}</td><td>${fmt(x.c)}</td><td>${penTxt(T.pe,x.s)||'<span class="mut">–</span>'}</td>${hasV?`<td>${x.v!=null?fmt(x.v):'–'}</td>`:''}</tr>`).join('');
 const final=t+T.tot*1000;
 const ex=T.pe.filter(e=>Number(e.s)===-1);
 const parts=[];
 if(T.n2)parts.push(T.n2===1?'1 tocco':T.n2+' tocchi');
 if(T.n50)parts.push(T.n50===1?'1 salto':T.n50+' salti');
 return `<div class="run"><div class="top"><div><b>Prova ${i+1}</b> <span class="mut">${esc(whenLong(r.d))}</span></div><div class="tot">${fmt(final)}</div></div>
 ${T.tot?`<div class="mut sub">tempo ${fmt(t)} + penalità ${T.tot} s</div>`:''}
 <table><thead><tr><th>Punto</th><th>Parziale</th><th>Totale</th><th>Pen.</th>${hasV?'<th>Nel video</th>':''}</tr></thead><tbody>${body}</tbody></table>
 ${ex.length?`<div class="mut" style="margin-top:6px">Dopo l'arrivo: ${penTxt(T.pe,-1)}</div>`:''}
 <div class="pt">${T.tot?`Penalità totali: +${T.tot} s <span class="mut">· ${parts.join(' · ')}</span>`:'<span class="mut">Nessuna penalità</span>'}</div>
 ${r.sv!=null?`<div class="mut" style="margin-top:6px">Start al ${fmt(r.sv)} del video</div>`:''}
 ${r.vf?`<div class="mut">Video: ${esc(r.vf)}</div>`:''}
 ${withEdit?`<div class="row"><button class="btn ghost sm" data-act="px2" data-id="${esc(r.id)}">+2 dopo arrivo</button><button class="btn ghost sm" data-act="px50" data-id="${esc(r.id)}">+50 dopo arrivo</button><button class="btn ghost sm" data-act="pxundo" data-id="${esc(r.id)}">− Annulla</button><button class="btn ghost sm" data-act="delrun" data-id="${esc(r.id)}" style="margin-left:auto">Elimina prova</button></div>`:''}</div>`;
}

let _db=null;
function idb(){
 return _db?Promise.resolve(_db):new Promise((res,rej)=>{
  const q=indexedDB.open('tempi_video_db',1);
  q.onupgradeneeded=()=>q.result.createObjectStore('blobs');
  q.onsuccess=()=>{_db=q.result;res(_db)};q.onerror=()=>rej(q.error);
 });
}
const blobPut=async(k,b)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('blobs','readwrite');t.objectStore('blobs').put(b,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
const blobGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('blobs').objectStore('blobs').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})};
const blobDel=async k=>{const d=await idb();return new Promise(res=>{const t=d.transaction('blobs','readwrite');t.objectStore('blobs').delete(k);t.oncomplete=()=>res();t.onerror=()=>res()})};
async function addVideo(name,blob,sid,at,extra){

/* orario di inizio dal nome file della fotocamera Samsung (es. 20261121_095012.mp4) */
function startFromName(n){
 const m=String(n).match(/(\d{4})(\d{2})(\d{2})[_-](\d{2})(\d{2})(\d{2})/);if(!m)return null;
 const t=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();return isFinite(t)?t:null;
}
function videoDuration(blob){
 return new Promise(res=>{
  const v=document.createElement('video');v.preload='metadata';const u=URL.createObjectURL(blob);
  let done=false;const fin=x=>{if(done)return;done=true;URL.revokeObjectURL(u);res(x)};
  v.onloadedmetadata=()=>fin(isFinite(v.duration)?Math.round(v.duration*1000):null);
  v.onerror=()=>fin(null);setTimeout(()=>fin(null),8000);v.src=u;
 });
}
const runEndMs=r=>Date.parse(r.d);
const runStartMs=r=>Date.parse(r.d)-(Number(r.t)||0);
/* discese che stanno dentro un video: per nome file (ripresa nell'app) o per orario (video Samsung) */
function videoRuns(v){
 const out=[];
 data.athletes.forEach(a=>a.runs.forEach(r=>{
  let pos=null;
  if(r.vf&&normName(r.vf)===v.name)pos=r.sv!=null?Number(r.sv)/1000:0;
  else if(v.st&&v.dur){
   const s=runStartMs(r),e=runEndMs(r);
   if(isFinite(s)&&s>=v.st-3000&&e<=v.st+v.dur+3000)pos=(s-v.st+(v.off||0))/1000;
  }
  if(pos!=null)out.push({a,r,pos:Math.max(0,pos)});
 }));
 out.sort((x,y)=>String(x.r.d).localeCompare(String(y.r.d)));return out;
}
function vidSessions(v){const ss=[];videoRuns(v).forEach(x=>{if(!ss.includes(x.r.sid))ss.push(x.r.sid)});return ss.length?ss:[v.sid]}
function runVideoMap(){const m=new Map();data.videos.forEach(v=>videoRuns(v).forEach(x=>{if(!m.has(x.r))m.set(x.r,{v,pos:x.pos})}));return m}

/* ---------- file dei tempi per il tablet ---------- */
const MARK='--- DATI (non modificare) ---';
function timesText(s){
 const L=['TEMPI — '+s.name,'Inizio: '+whenLong(s.start),''];const runs=[];
 data.athletes.forEach(a=>{
  const rs=runsOf(a,s.id);if(!rs.length)return;L.push(a.name);
  rs.forEach((r,i)=>{
   const T=totals(r),ints=(r.l||[]).map(l=>fmt(l.c));
   L.push('  Disc. '+(i+1)+': '+fmt(Number(r.t)+T.tot*1000)+(T.tot?' (tempo '+fmt(r.t)+' + pen '+T.tot+' s)':'')+(ints.length?' · int. '+ints.join(' · '):''));
   runs.push({a:a.name,r});
  });
  L.push('');
 });
 L.push(MARK,JSON.stringify({v:1,exp:Date.now(),session:{id:s.id,name:s.name,start:s.start,end:s.end||null},runs}));
 return L.join('\n');
}
const timesFile=s=>new File([timesText(s)],'Tempi_'+slug(s.name)+'_'+stamp()+'.txt',{type:'text/plain'});
function parseTimes(txt){
 const i=txt.indexOf(MARK);if(i<0)return null;
 try{const m=JSON.parse(txt.slice(i+MARK.length).trim());if(m&&m.v===1&&m.session&&m.session.id!=null&&Array.isArray(m.runs))return m}catch{}
 return null;
}
function mergeTimes(m){
 const sm=m.session;let s=sessById(String(sm.id));
 if(s&&s.imp&&Number(m.exp)<s.imp)return -1;
 if(!s){s={id:String(sm.id),name:String(sm.name||'Allenamento'),start:String(sm.start||new Date().toISOString()),end:sm.end?String(sm.end):null};data.sessions.push(s)}
 else{s.name=String(sm.name||s.name);s.end=sm.end?String(sm.end):null}
 s.imp=Number(m.exp)||Date.now();
 const keep=new Set();let n=0;
 m.runs.forEach(x=>{
  const nm=String(x&&x.a||'').trim();if(!nm||!x.r||x.r.id==null)return;
  let a=data.athletes.find(z=>z.name.toLowerCase()===nm.toLowerCase());
  if(!a){a={id:'a'+Date.now()+Math.random().toString(36).slice(2,6),name:nm,link:'',runs:[]};data.athletes.push(a)}
  const r=Object.assign({},x.r,{id:String(x.r.id),sid:s.id});
  const i=a.runs.findIndex(z=>z.id===r.id);if(i>=0)a.runs[i]=r;else a.runs.push(r);
  keep.add(r.id);n++;
 });
 data.athletes.forEach(a=>{a.runs=a.runs.filter(r=>r.sid!==s.id||keep.has(r.id));a.runs.sort((p,q)=>String(p.d).localeCompare(String(q.d)))});
 viewSid=s.id;return n;
}
async function importFiles(files){
 files=Array.from(files||[]);if(!files.length)return;
 toast('Importazione in corso…');
 let nt=0,nr=0,nv=0,old=0,bad=0;const vids=[];
 for(const f of files){
  if(/\.txt$/i.test(f.name)||f.type==='text/plain'){
   let m=null;try{m=parseTimes(await f.text())}catch{}
   if(!m){bad++;continue}
   const n=mergeTimes(m);if(n<0)old++;else{nt++;nr+=n}
  }else if((f.type||'').startsWith('video/')||/\.(mp4|webm|mov|m4v)$/i.test(f.name))vids.push(f);
  else bad++;
 }
 for(const f of vids){
  const nm=normName(f.name),st=startFromName(nm),dur=await videoDuration(f);
  const extra={};if(st)extra.st=st;if(dur)extra.dur=dur;
  const old=data.videos.find(v=>v.name===nm);if(old&&old.off)extra.off=old.off;
  let sid=null;const hit=videoRuns({name:nm,st:st||null,dur:dur||null,off:extra.off||0})[0];if(hit)sid=hit.r.sid;
  if(!sid)sid=viewSid||(latestSess()&&latestSess().id)||null;
  if(!sid){const s=newSession();s.end=new Date().toISOString();sid=s.id}
  if(await addVideo(nm,f,sid,st||f.lastModified,extra))nv++;
 }
 if(!data.current&&data.athletes.length)data.current=data.athletes[0].id;
 save();renderAll();
 const msg=[];if(nt)msg.push(nr+' discese');if(nv)msg.push(nv+(nv===1?' video':' video'));if(old)msg.push('file tempi più vecchio ignorato');if(bad)msg.push(bad+' file non riconosciuti');
 toast(msg.length?'Importato: '+msg.join(' · '):'Niente da importare');
}

function stopT(){
 if(!running)return;
 const now=performance.now();running=false;cancelAnimationFrame(raf);
 const t=Math.round(now-t0);$('#clock').textContent=fmt(t);
 const a=data.athletes.find(x=>x.id===runAth);
 if(a){
  const run={id:String(Date.now()),sid:runSid,d:new Date().toISOString(),t,l:lapsLive,sv:runVid0,tv:recording?Math.round(now-recStart):null,vf:null,pe:livePen};
  a.runs.push(run);lastRunRef={a:a.id,id:run.id};
  if(recording)recRuns.push({a:a.id,id:run.id});
  save();
 }
 if(recording&&autoSec()>0){autoAt=performance.now()+autoSec()*1000;clearTimeout(autoTimer);autoTimer=setTimeout(stopRec,autoSec()*1000);recLabel()}
 lapsLive=[];livePen=[];renderAll();buzz();
}

/* ---------- penalità: comandi ---------- */
function lastRun(){
 if(!lastRunRef)return null;
 const a=data.athletes.find(x=>x.id===lastRunRef.a);if(!a)return null;
 const r=a.runs.find(x=>x.id===lastRunRef.id);
 return r?{a,r,n:runNo(a,r)}:null;
}
function penTarget(){
 if(running)return{label:'Pen. tratto '+(lapsLive.length+1)};
 const L=lastRun();
 return L?{label:'Pen. prova '+L.n}:null;
}
function addPen(k){
 if(running){livePen.push({s:lapsLive.length,k});renderLive();buzz();return}
 const L=lastRun();
 if(!L){toast('Nessuna prova a cui aggiungere');return}
 (L.r.pe=Array.isArray(L.r.pe)?L.r.pe:[]).push({s:-1,k});
 save();renderAll();buzz();
}
function undoPen(){
 if(running){if(livePen.length){livePen.pop();renderLive();buzz()}else toast('Nessuna penalità da annullare');return}
 const L=lastRun();if(!L)return;
 const pe=Array.isArray(L.r.pe)?L.r.pe:[];let i=-1;
 pe.forEach((e,k)=>{if(Number(e.s)===-1)i=k});
 if(i<0){toast('Nessuna penalità aggiunta dopo l\'arrivo');return}
 pe.splice(i,1);save();renderAll();buzz();
}

 $('#p2').disabled=!t;$('#p50').disabled=!t;$('#pUndo').disabled=!t;

}
function renderLive(){
 const h=$('#hud');
 if(running){
  const n=lapsLive.length,pt=livePen.reduce((s,e)=>s+(Number(e.k)===50?50:2),0);
  let tx=n?('Int. '+n+' · '+fmt(lapsLive[n-1].c)+' (+'+fmt(lapsLive[n-1].c-(n>1?lapsLive[n-2].c:0))+')'):'In corso';
  if(pt)tx+=' · pen +'+pt;
  h.textContent=tx;
 }else{
  const L=lastRun();
  if(L){const T=totals(L.r);h.textContent=L.a.name+' · prova '+L.n+' · '+fmt(Number(L.r.t)+T.tot*1000)+(T.tot?' (pen +'+T.tot+')':'')}
  else h.textContent='';
 }
 ui();
}

function renderTable(){
 const box=$('#sessTable'),s=sessById(viewSid);
 const vm=runVideoMap();
 const pl=r=>{const x=vm.get(r);return x?' <button class="pl" data-pv="'+esc(x.v.name)+'" data-id="'+esc(r.id)+'" aria-label="Guarda il video">▶</button>':''};
 if(!s){box.innerHTML='<p class="mut">Nessun allenamento. Premi START nella schermata di ripresa per iniziarne uno.</p>';return}
 const ath=data.athletes.map(a=>({a,rs:runsOf(a,s.id)})).filter(x=>x.rs.length);
 ath.sort((x,y)=>String(x.rs[0].d).localeCompare(String(y.rs[0].d)));
 if(!ath.length){box.innerHTML='<p class="mut">Ancora nessuna discesa in questo allenamento.</p>';return}
 let maxL=0;ath.forEach(x=>x.rs.forEach(r=>{maxL=Math.max(maxL,Array.isArray(r.l)?r.l.length:0)}));
 const head='<tr><th class="l">Atleta</th><th>Disc.</th>'+Array.from({length:maxL},(_,k)=>'<th>Int. '+(k+1)+'</th>').join('')+'<th>Tempo</th><th>Pen.</th><th>Finale</th></tr>';
 const body=ath.map(({a,rs})=>{
  const T=rs.map(r=>totals(r)),finals=rs.map((r,i)=>(Number(r.t)||0)+T[i].tot*1000),best=Math.min(...finals);
  return '<tbody class="ath">'+rs.map((r,i)=>{
   const l=Array.isArray(r.l)?r.l:[];
   const cells=Array.from({length:maxL},(_,k)=>l[k]?'<td>'+fmt(l[k].c)+(penTxt(T[i].pe,k)?' '+penTxt(T[i].pe,k):'')+'</td>':'<td class="mut">–</td>').join('');
   const pa=penTxt(T[i].pe,l.length);
   return '<tr>'+(i===0?`<td class="an" rowspan="${rs.length}"><b>${esc(a.name)}</b><div class="mut">Migliore ${fmt(best)}</div></td>`:'')
    +`<td>${i+1}${pl(r)}</td>${cells}<td>${fmt(r.t)}${pa?' '+pa:''}</td><td>${T[i].tot?'+'+T[i].tot:'<span class="mut">–</span>'}</td><td class="fn${finals[i]===best?' best':''}">${fmt(finals[i])}</td></tr>`;
  }).join('')+'</tbody>';
 }).join('');
 box.innerHTML=`<div class="tw"><table class="st"><thead>${head}</thead>${body}</table></div>`;
}
function renderVideos(){
 const box=$('#vidList'),s=sessById(viewSid);
 if(!s){box.innerHTML='<p class="mut">Nessun video.</p>';return}
 const vids=data.videos.filter(v=>vidSessions(v).includes(s.id));
 if(!vids.length){box.innerHTML='<p class="mut">Nessun video in questo allenamento.'+(isTablet()?' Importa i file ricevuti dal telefono con il tasto «Importa».':'')+'</p>';return}
 const groups={};
 vids.forEach(v=>{
  const runs=videoRuns(v).filter(x=>x.r.sid===s.id);
  const names=[...new Set(runs.map(x=>x.a.name))];
  const key=names.length?names.join(', '):'Senza discese collegate';
  (groups[key]=groups[key]||[]).push({v,runs});
 });
 box.innerHTML=Object.keys(groups).sort((x,y)=>x.localeCompare(y)).map(k=>`<div class="vg"><h2>${esc(k)}</h2>`+groups[k].sort((x,y)=>(x.v.st||x.v.at)-(y.v.st||y.v.at)).map(({v,runs})=>{
  const when=whenLong(v.st||(runs[0]?runs[0].r.d:v.at));
  const lines=runs.map(x=>`<div class="vr"><span>${esc(x.a.name)} · discesa ${runNo(x.a,x.r)} · <b>${fmt((Number(x.r.t)||0)+totals(x.r).tot*1000)}</b></span><button class="btn go sm" data-vact="playrun" data-n="${esc(v.name)}" data-id="${esc(x.r.id)}">▶ Da qui</button></div>`).join('');
  return `<div class="vcard"><div class="mut">${esc(when)} · ${Math.max(1,Math.round((v.size||0)/1048576))} MB · ${esc(v.name)}</div>${lines||'<div class="mut" style="margin-top:6px">Nessuna discesa collegata a questo video (controlla che il nome file contenga data e ora, es. 20261121_095012).</div>'}
  <div class="row"><button class="btn ghost sm" data-vact="play" data-n="${esc(v.name)}">▶ Guarda tutto</button><button class="btn ghost sm" data-vact="dl" data-n="${esc(v.name)}">Scarica</button><button class="btn ghost sm" data-vact="share" data-n="${esc(v.name)}" data-sid="${esc(v.sid)}">${isTablet()?'Condividi':'Invia al tablet'}</button><button class="btn ghost sm" data-vact="del" data-n="${esc(v.name)}" style="margin-left:auto">Elimina</button></div></div>`;
 }).join('')+'</div>').join('');
}

function summary(a){
 return a.name+'\n'+runsOf(a,viewSid).map((r,i)=>{
  const T=totals(r),ints=(r.l||[]).map(l=>fmt(l.c));
  return 'Prova '+(i+1)+': '+fmt(Number(r.t)+T.tot*1000)+(T.tot?' (tempo '+fmt(r.t)+' + pen '+T.tot+' s)':'')+(ints.length?' · int. '+ints.join(' · '):'');
 }).join('\n');
}
async function shareTimes(){
 const a=cur();const rs=a?runsOf(a,viewSid):[];if(!a||!rs.length){toast('Nessun tempo da condividere')}else{
  const runs=rs.map(r=>({d:r.d,t:r.t,l:(r.l||[]).map(x=>({c:x.c,v:x.v})),sv:r.sv,tv:r.tv,pe:r.pe||[]}));
  const url=location.origin+location.pathname+'#v='+enc({n:a.name,u:a.link||'',r:runs});
  if(navigator.share){try{await navigator.share({title:'Tempi '+a.name,text:summary(a),url});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('Link copiato')}catch{toast('Copia non riuscita')}
 }
}
function csv(){
 const L=[['Allenamento','Atleta','Prova','Data','Punto','Parziale','Totale','Penalità tratto (s)','Tempo nel video','File video','Penalità totali (s)','Tempo finale']];
 data.sessions.slice().sort((a,b)=>String(a.start).localeCompare(String(b.start))).forEach(s=>data.athletes.forEach(a=>runsOf(a,s.id).forEach((r,i)=>{
  const T=totals(r),d=whenLong(r.d),l=r.l||[];let prev=0;
  const ps=k=>T.pe.filter(e=>Number(e.s)===k).reduce((x,e)=>x+(Number(e.k)===50?50:2),0);
  l.forEach((x,k)=>{L.push([s.name,a.name,i+1,d,'Intertempo '+(k+1),fmt(x.c-prev),fmt(x.c),ps(k),x.v!=null?fmt(x.v):'',r.vf||'','','']);prev=x.c});
  L.push([s.name,a.name,i+1,d,'Arrivo',fmt(r.t-prev),fmt(r.t),ps(l.length),r.tv!=null?fmt(r.tv):'',r.vf||'',T.tot,fmt(r.t+T.tot*1000)]);
  if(T.pe.some(e=>Number(e.s)===-1))L.push([s.name,a.name,i+1,d,"Dopo l'arrivo",'','',ps(-1),'','','','']);
 })));
 const s='﻿'+L.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
 dl(new Blob([s],{type:'text/csv;charset=utf-8'}),'tempi_'+stamp()+'.csv');
}
function arm(b,fn){
 if(b.dataset.arm){fn();return}
 b.dataset.arm='1';const old=b.textContent;b.textContent='Conferma?';b.classList.add('armed');
 setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent=old;b.classList.remove('armed')}},3000);
}
async function deleteSession(id){
 const vids=data.videos.filter(v=>{const ss=vidSessions(v);return ss.length===1&&ss[0]===id});
 for(const v of vids){try{await blobDel(v.name)}catch{}}
 data.videos=data.videos.filter(v=>!vids.includes(v));
 data.athletes.forEach(a=>{a.runs=a.runs.filter(r=>r.sid!==id)});
 data.sessions=data.sessions.filter(s=>s.id!==id);
 if(lastRunRef&&!lastRun())lastRunRef=null;
 if(viewSid===id)viewSid=defView();
 save();renderAll();
}

 $('#bStart').onclick=startT;$('#bLap').onclick=lapT;$('#bStop').onclick=stopT;

 $('#bSend').onclick=()=>{if(lastVideo)sendToTablet(lastVideo.name,lastVideo.blob,lastVideo.sid)};

 $('#bCsv').onclick=csv;
 $('#bImport').onclick=()=>$('#impF').click();
 $('#impF').onchange=async e=>{const f=e.target.files;await importFiles(f);e.target.value=''};
 $('#pvClose').onclick=closePlayer;$('#pvM').onclick=()=>adjSync(-500);$('#pvP').onclick=()=>adjSync(500);
 $('#sessTable').onclick=e=>{const b=e.target.closest('[data-pv]');if(b)playVideo(b.dataset.pv,b.dataset.id)};
 $('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)showTab(b.dataset.tab)};
 $('#vbanner').onclick=e=>{if(e.target.closest('[data-ban]')){viewSid=defView();renderAll()}};
 $('#athSel').onchange=e=>{
  if(e.target.value==='__new'){renderAth();showTempi('atleti',true);return}
  if(e.target.value)setCurrent(e.target.value);
 };
 $('#addF').onsubmit=e=>{
  e.preventDefault();const n=$('#newA').value.trim();if(!n)return;
  const a={id:'a'+Date.now(),name:n,link:'',runs:[]};data.athletes.push(a);
  $('#newA').value='';setCurrent(a.id);
 };
 $('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;setCurrent(b.dataset.id)};
 $('#results').addEventListener('input',e=>{if(e.target.id==='vlink'){const a=cur();if(a){a.link=e.target.value.trim();save()}}});
 $('#results').onclick=e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,a=cur();
  const run=a&&a.runs.find(x=>x.id===b.dataset.id);
  if(act==='shareT')shareTimes();
  else if(act==='px2'||act==='px50'){if(run){(run.pe=Array.isArray(run.pe)?run.pe:[]).push({s:-1,k:act==='px2'?2:50});save();renderAll()}}
  else if(act==='pxundo'){
   if(run){
    const pe=Array.isArray(run.pe)?run.pe:[];let i=-1;pe.forEach((x,k)=>{if(Number(x.s)===-1)i=k});
    if(i>=0){pe.splice(i,1);save();renderAll()}else toast("Nessuna penalità aggiunta dopo l'arrivo");
   }
  }
  else if(act==='delrun')arm(b,()=>{a.runs=a.runs.filter(r=>r.id!==b.dataset.id);if(lastRunRef&&lastRunRef.id===b.dataset.id)lastRunRef=null;save();renderAll()});
  else if(act==='delath')arm(b,()=>{
   data.athletes=data.athletes.filter(x=>x.id!==a.id);
   if(lastRunRef&&lastRunRef.a===a.id)lastRunRef=null;
   data.current=data.athletes.length?data.athletes[0].id:null;
   save();renderAll();
  });
 };
 $('#vidList').onclick=async e=>{
  const b=e.target.closest('[data-vact]');if(!b)return;const act=b.dataset.vact,n=b.dataset.n;
  if(act==='play')playVideo(n);
  else if(act==='playrun')playVideo(n,b.dataset.id);
  else if(act==='dl'||act==='share'){
   let blob=null;try{blob=await blobGet(n)}catch{}
   if(!blob){toast('Video non disponibile su questo dispositivo');return}
   if(act==='dl')dl(blob,n);
   else if(isTablet())shareFiles([new File([blob],n,{type:blob.type||'video/mp4'})],n);
   else sendToTablet(n,blob,b.dataset.sid);
  }
  else if(act==='del')arm(b,async()=>{try{await blobDel(n)}catch{}data.videos=data.videos.filter(v=>v.name!==n);save();renderAll()});
 };
 $('#sessBox').addEventListener('change',e=>{
  if(e.target.id==='sname'){const o=openSess();if(o){o.name=e.target.value.trim()||o.name;save();renderTitle()}}
 });
 $('#sessBox').onclick=e=>{
  const b=e.target.closest('[data-sact]');if(!b)return;const act=b.dataset.sact;
  if(act==='close'){if(running){toast('Ferma prima il cronometro');return}closeSession(openSess());viewSid=defView();renderAll();toast('Allenamento chiuso')}
  else if(act==='new'){if(running){toast('Ferma prima il cronometro');return}closeSession(openSess());const s=newSession();renderAll();showTab('tempi');toast('Nuovo allenamento: '+s.name)}
  else if(act==='view'){viewSid=b.dataset.id;renderAll();showTab('tempi')}
  else if(act==='del'){
   const id=b.dataset.id;
   arm(b,()=>{
    if(running&&runSid===id){toast('Ferma prima il cronometro');return}
    deleteSession(id);
   });
  }
 };
}
let wake=null;

async function launchCheck(){
 const o=openSess();if(!o)return;
 const last=lastActivity(o);
 if(Date.now()-new Date(last).getTime()>6*3600e3){
  const r=await ask('C\'è un allenamento ancora aperto: «'+o.name+'», ultima attività '+whenLong(last)+'. Vuoi continuarlo o iniziarne uno nuovo?',[{t:'Continua',v:'c'},{t:'Nuovo allenamento',v:'n',cls:'go'}]);
  if(r==='n'){closeSession(o);const s=newSession();renderAll();toast('Nuovo allenamento: '+s.name)}
 }
}

function init(){
 document.body.classList.add('app',data.mode);
 const tablet=data.mode==='tablet';
 $('#bBack').textContent=data.mode==='camera'?'← Ripresa':'← Cronometro';
 if(!data.current&&data.athletes.length)data.current=data.athletes[0].id;
 viewSid=defView();
 $('#quality').value=data.quality;$('#autoStop').value=String(autoSec());$('#devMode').value=data.mode;
 bind();renderAll();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
 if(tablet){showTempi('tempi')}
 else{
  $('#cam').hidden=false;wl();
  if(data.mode==='camera'){startCamera();try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch{}}
  launchCheck();
 }
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}

if(location.hash.startsWith('#v=')){
 try{viewer(dec(location.hash.slice(3)))}catch{document.body.innerHTML='<p style="padding:16px">Link non valido.</p>'}
}else init();
</script>
</body>
